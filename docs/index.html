<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="将本地文件名中的小写英文字母批量转换为大写。" />
  <title>文件名大写转换</title>
  <style>
    :root{--ink:#172036;--blue:#2863ff;--line:#dce3ef;--muted:#667085;--paper:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif}.page{width:min(920px,calc(100% - 32px));margin:auto;padding:72px 0 64px}.eyebrow,.step{margin:0 0 10px;color:var(--blue);font-size:14px;font-weight:700;letter-spacing:.08em}h1,h2{margin:0;letter-spacing:-.035em}h1{font-size:clamp(38px,7vw,62px);line-height:1.05}h2{font-size:24px}.intro{max-width:670px;margin:18px 0 38px;color:var(--muted);font-size:17px;line-height:1.75}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(24px,5vw,42px);box-shadow:0 16px 42px rgba(28,44,75,.08)}.row{display:flex;justify-content:space-between;align-items:center;gap:20px}.folder{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 12px;background:#eef3ff;border-radius:999px;color:#244fab;font-size:14px}button{border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;transition:transform .18s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.62;cursor:not-allowed}.select{width:100%;margin-top:25px;padding:15px 18px;background:var(--blue);color:#fff}.rename{padding:12px 16px;background:#172036;color:#fff;font-size:14px}.note{margin:13px 0 0;color:var(--muted);font-size:13px;line-height:1.65}.notice{margin:25px 0 0;padding:13px 15px;background:#f0f5ff;color:#244fab;border-radius:9px;font-size:14px}.results{display:none;margin-top:38px;padding-top:31px;border-top:1px solid var(--line)}.table-wrap{margin-top:22px;max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:14px;text-align:left}th{position:sticky;top:0;padding:12px 14px;background:#f8faff;color:#526078;font-size:12px}td{max-width:260px;overflow-wrap:anywhere;padding:14px;border-top:1px solid #edf0f5}.pending{color:#735a06}.done{color:#157142}.error{color:#bd3131}.example{margin-top:22px;padding:18px 22px;color:#526078;background:#eef3ff;border-radius:12px;font-size:14px;line-height:1.7}.example p{margin:0}.example strong{color:#244fab}@media(max-width:600px){.page{padding-top:48px}.row{align-items:flex-start;flex-direction:column}.folder{max-width:100%}.rename{width:100%}th,td{min-width:155px}}
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">本地文件整理工具</p><h1>文件名大写转换</h1>
    <p class="intro">一键将文件名中的小写英文字母改成大写；数字、中文、空格、符号和扩展名中的其他字符都保持原样。</p>
    <section class="card"><div class="row"><div><p class="step">第 1 步</p><h2>选择文件夹</h2></div><span id="folder" class="folder" hidden></span></div>
      <button id="choose" class="select">选择文件夹</button><p class="note">文件只在你的电脑上处理，不会上传到服务器。仅处理当前文件夹内的文件，不会进入子文件夹。</p><p id="notice" class="notice" hidden></p>
      <div id="results" class="results"><div class="row"><div><p class="step">第 2 步</p><h2>确认改名</h2></div><button id="rename" class="rename"></button></div><div class="table-wrap"><table><thead><tr><th>原文件名</th><th>改为</th><th>状态</th></tr></thead><tbody id="list"></tbody></table></div></div>
    </section><section class="example"><p>例如：<strong>report-final_v2.docx</strong> → <strong>REPORT-FINAL_V2.DOCX</strong></p></section>
  </main>
  <script>
    const $=id=>document.getElementById(id);let items=[];
    function notice(text){$('notice').textContent=text;$('notice').hidden=!text}
    function render(){const body=$('list');body.replaceChildren(...items.map((x,i)=>{const row=document.createElement('tr');row.innerHTML=`<td>${escapeHtml(x.from)}</td><td>${escapeHtml(x.to)}</td><td class="${x.state}">${x.label}${x.message?'：'+escapeHtml(x.message):''}</td>`;return row}));$('results').style.display=items.length?'block':'none';$('rename').textContent=`确认改名 ${items.length} 个文件`}
    function escapeHtml(v){return v.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    $('choose').onclick=async()=>{if(!window.showDirectoryPicker){notice('请使用最新版 Chrome 或 Edge 打开本工具，以便直接修改文件名。');return}try{const dir=await window.showDirectoryPicker();items=[];for await(const [,h] of dir.entries()){if(h.kind!=='file')continue;const to=h.name.replace(/[a-z]/g,c=>c.toUpperCase());if(to!==h.name)items.push({handle:h,from:h.name,to,state:'pending',label:'待处理'})}$('folder').textContent=dir.name;$('folder').hidden=false;notice(items.length?`已找到 ${items.length} 个需要改名的文件。`:'这个文件夹里的文件名已经全部符合要求。');render()}catch(e){if(e.name!=='AbortError')notice('无法读取该文件夹，请再试一次。')}};
    $('rename').onclick=async()=>{const button=$('rename');button.disabled=true;let done=0;for(const x of items){try{if(await x.handle.requestPermission({mode:'readwrite'})!=='granted'){x.state='error';x.label='跳过';x.message='未获得修改权限'}else{await x.handle.move(x.to);x.state='done';x.label='已完成';done++}}catch(e){x.state='error';x.label='失败';x.message=e.message||'改名失败'}render()}button.disabled=false;notice(`处理完成：${done} 个文件已改名。`)};
  </script>
</body>
</html>
